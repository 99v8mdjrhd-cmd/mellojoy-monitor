
name: Mellojoy Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check product feed
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://www.mellojoyjapan.com/products.json?limit=250"
          req = urllib.request.Request(
              url, headers={"User-Agent": "Mozilla/5.0"}
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              products = json.load(r)["products"]

          print("取得した商品数:", len(products))
          for p in products[:5]:
              print(p["title"])
          PY
